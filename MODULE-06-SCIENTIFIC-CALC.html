<!DOCTYPE html>
<html lang="el" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODULE 06 — Scientific Calculator</title>
    <style>
        /* ── SHARED BASE CSS ── */
        :root { --bg:#0f172a; --fg:#f1f5f9; --primary:#3b82f6; --secondary:#6366f1; }
        * { margin:0; padding:0; box-sizing:border-box;
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
            -webkit-font-smoothing:antialiased; }
        .is-animating { pointer-events:none !important; }
        html { background:#0f172a; min-height:100%; }
        body {
            background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#1a1f3a 100%);
            min-height:100dvh; min-height:100vh; color:white; overflow-x:hidden;
        }
        body::before, body::after {
            content:''; position:fixed; border-radius:50%; pointer-events:none; z-index:0;
        }
        body::before {
            width:420px; height:420px;
            background:radial-gradient(circle,rgba(99,102,241,0.09) 0%,transparent 70%);
            top:-80px; left:-80px;
        }
        body::after {
            width:360px; height:360px;
            background:radial-gradient(circle,rgba(168,85,247,0.07) 0%,transparent 70%);
            bottom:40px; right:-60px;
        }
        .screen {
            display:none; padding:20px; padding-bottom:170px;
            min-height:100dvh; min-height:100vh;
            position:relative; z-index:1; contain:layout style;
        }
        .screen.active { display:block; animation:screenIn 0.5s cubic-bezier(0.2,0.8,0.2,1) both; }
        @keyframes screenIn {
            from { opacity:0; transform:scale3d(0.96,0.96,1) translateY(10px); }
            to   { opacity:1; transform:scale3d(1,1,1) translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity:0; transform:translateY(15px); }
            to   { opacity:1; transform:translateY(0); }
        }
        .screen.active .calc-grid > * { animation:fadeIn 0.5s cubic-bezier(0.2,0.8,0.2,1) both; }
        .screen.active .calc-grid > *:nth-child(1)  { animation-delay:0.05s; }
        .screen.active .calc-grid > *:nth-child(2)  { animation-delay:0.08s; }
        .screen.active .calc-grid > *:nth-child(3)  { animation-delay:0.11s; }
        .screen.active .calc-grid > *:nth-child(4)  { animation-delay:0.14s; }
        .screen.active .calc-grid > *:nth-child(n+5){ animation-delay:0.17s; }
        .header { text-align:center; padding:40px 20px 20px; }
        .logo { display:flex; align-items:center; gap:12px; margin-bottom:8px; }
        .logo-icon {
            width:48px; height:48px;
            background:linear-gradient(135deg,#6366f1,#a855f7);
            border-radius:12px; display:flex; align-items:center; justify-content:center;
            font-weight:800; font-size:1.8rem; color:#fff;
            box-shadow:0 8px 24px rgba(99,102,241,0.3);
            position:relative; overflow:hidden;
        }
        .logo-icon::before {
            content:''; position:absolute; top:-50%; left:-50%; width:200%; height:200%;
            background:linear-gradient(45deg,transparent 30%,rgba(255,255,255,0.1) 50%,transparent 70%);
            animation:shimmer 3s infinite;
        }
        @keyframes shimmer {
            0%   { transform:translate(-100%,-100%) rotate(0deg); }
            100% { transform:translate(100%,100%) rotate(0deg); }
        }
        .logo-text {
            font-size:2.5rem; font-weight:700;
            background:linear-gradient(135deg,#fff,#e2e8f0);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
        }
        .logo span {
            background:linear-gradient(135deg,#6366f1,#a855f7);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
        }
        .subtitle { color:#94a3b8; font-size:0.95rem; margin-top:5px; }
        .back-btn {
            background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08);
            border-radius:12px; color:#94a3b8; font-size:0.95rem;
            padding:10px 16px; cursor:pointer; display:inline-flex;
            align-items:center; gap:8px; margin-bottom:20px;
            transition:all 0.2s cubic-bezier(0.34,1.56,0.64,1);
            -webkit-tap-highlight-color:transparent;
        }
        .back-btn:hover { color:#e2e8f0; background:rgba(255,255,255,0.1); transform:translateX(-3px); }
        ::-webkit-scrollbar { width:8px; }
        ::-webkit-scrollbar-track { background:rgba(15,23,42,0.3); }
        ::-webkit-scrollbar-thumb { background:rgba(71,85,105,0.5); border-radius:4px; }

        /* ── Calc display (shared with std) ── */
        .calc-display {
            background:rgba(15,23,42,0.6); border:1px solid rgba(71,85,105,0.3);
            border-radius:20px; padding:30px 20px; margin-bottom:20px; text-align:right;
        }
        .calc-value { font-size:3rem; font-weight:300; overflow-x:auto; white-space:nowrap; }
        .calc-grid {
            display:grid !important; grid-template-columns:repeat(4,1fr) !important;
            gap:12px !important; max-width:500px; margin:0 auto;
        }
        .calc-btn {
            height:70px; border-radius:20px; border:none; font-size:1.3rem; font-weight:600;
            cursor:pointer; color:white; position:relative; overflow:hidden;
            -webkit-tap-highlight-color:transparent; user-select:none; touch-action:manipulation;
            transition:transform 0.18s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.18s ease, filter 0.15s ease;
        }
        .calc-btn:hover  { transform:translateY(-3px) scale(1.06) !important; filter:brightness(1.15) !important; }
        .calc-btn:active { transform:scale(0.87) !important; transition:transform 0.07s cubic-bezier(0.68,-0.55,0.27,1.55) !important; }
        .btn-number   { background:#fff !important; border:1px solid #e2e8f0 !important; color:#0f172a !important; box-shadow:0 4px 10px rgba(0,0,0,0.3) !important; font-weight:800 !important; }
        .btn-operator { background:#3b82f6 !important; border:1px solid #60a5fa !important; color:white !important; box-shadow:0 4px 15px rgba(59,130,246,0.4) !important; font-weight:800 !important; }
        .btn-operator:hover { box-shadow:0 6px 20px rgba(59,130,246,0.4), 0 0 0 1px rgba(96,165,250,0.3) !important; }
        .btn-clear    { background:#ef4444; border:1px solid #f87171; color:white; }
        .btn-clear:hover { box-shadow:0 6px 20px rgba(239,68,68,0.4) !important; }
        .btn-equals   { background:linear-gradient(135deg,#6366f1,#a855f7); border:none; }
        .btn-equals:hover { box-shadow:0 8px 28px rgba(99,102,241,0.55), 0 0 0 1px rgba(168,85,247,0.4) !important; transform:translateY(-3px) scale(1.07) !important; }

        /* ── History panel (shared with std) ── */
        .history-btn {
            position:absolute; top:20px; right:20px;
            background:rgba(99,102,241,0.2); border:1px solid rgba(99,102,241,0.3);
            color:#818cf8; padding:10px 20px; border-radius:15px;
            cursor:pointer; font-size:0.95rem; font-weight:600; transition:all 0.3s ease; z-index:10;
        }
        .history-btn:hover { background:rgba(99,102,241,0.3); transform:translateY(-2px); }
        .history-panel {
            display:none; position:fixed; top:80px; right:20px; width:320px; max-height:70vh;
            background:rgba(10,14,40,0.92) !important; border:1px solid rgba(99,102,241,0.25) !important;
            border-radius:20px; padding:20px; overflow-y:auto;
            backdrop-filter:blur(20px) saturate(180%) !important;
            box-shadow:0 0 0 1px rgba(255,255,255,0.05), 0 24px 60px rgba(0,0,0,0.5) !important;
            z-index:100; animation:slideInRight 0.4s cubic-bezier(0.68,-0.55,0.265,1.55);
        }
        @keyframes slideInRight {
            from { opacity:0; transform:translateX(100px); }
            to   { opacity:1; transform:translateX(0); }
        }
        .history-panel.show { display:block; }
        .history-title { font-size:1.2rem; font-weight:600; margin-bottom:15px; color:#818cf8; display:flex; justify-content:space-between; align-items:center; }
        .history-clear { background:rgba(239,68,68,0.2); border:1px solid rgba(239,68,68,0.3); color:#f87171; padding:5px 12px; border-radius:8px; cursor:pointer; font-size:0.85rem; }
        .history-item { background:rgba(30,41,59,0.6); border:1px solid rgba(71,85,105,0.3); border-radius:12px; padding:12px; margin-bottom:10px; cursor:pointer; transition:all 0.22s cubic-bezier(0.34,1.56,0.64,1); }
        .history-item:hover { background:rgba(51,65,85,0.6); transform:translateX(-6px) scale(1.01) !important; border-color:rgba(99,102,241,0.4) !important; }
        .history-expr   { color:#94a3b8; font-size:0.9rem; margin-bottom:5px; }
        .history-result { color:#60a5fa; font-size:1.1rem; font-weight:600; }

        /* ── MODULE 06 — Scientific grid & buttons ── */
        .sci-grid {
            display:grid; grid-template-columns:repeat(4,1fr);
            gap:10px; max-width:500px; margin:0 auto 15px;
        }
        .btn-sci {
            height:55px; border-radius:15px;
            border:1px solid rgba(139,92,246,0.3); background:rgba(139,92,246,0.15);
            color:#a78bfa; font-size:1rem; font-weight:600; cursor:pointer;
            transition:transform 0.15s cubic-bezier(0.34,1.56,0.64,1), background 0.15s ease, box-shadow 0.15s ease;
            position:relative; overflow:hidden; -webkit-tap-highlight-color:transparent;
        }
        .btn-sci:hover {
            background:rgba(139,92,246,0.3);
            transform:translateY(-3px) scale(1.07) !important;
            box-shadow:0 8px 22px rgba(139,92,246,0.4), 0 0 0 1px rgba(167,139,250,0.3) !important;
        }
        .btn-sci:active { transform:scale(0.88) !important; transition:transform 0.08s ease !important; }

        /* ── Responsive ── */
        @media (min-width:601px) and (max-width:1024px) {
            .sci-grid { max-width:540px !important; gap:12px !important; }
            .calc-grid { max-width:540px !important; gap:14px !important; }
            .btn-sci { height:58px; font-size:1.05rem; }
            .calc-btn { height:72px; font-size:1.35rem; }
        }
        @media (max-width:600px) {
            .calc-value { font-size:2.4rem; }
            .sci-grid  { gap:7px !important; max-width:100% !important; }
            .calc-grid { gap:8px !important; max-width:100% !important; }
            .btn-sci   { height:48px; border-radius:12px; font-size:0.85rem; }
            .calc-btn  { height:56px; border-radius:14px; font-size:1.05rem; }
        }
        @media (max-width:480px) {
            .screen { padding:15px; padding-bottom:140px; }
            .calc-display { padding:20px 15px; margin-bottom:15px; }
        }
    
/* ── Light-theme contrast overrides (auto-added) ── */
body.theme-light .back-btn{background:#1e293b;border-color:#334155;color:#f1f5f9;}
body.theme-light .back-btn:hover{background:#334155;border-color:#475569;color:#ffffff;}
body.theme-light .subtitle{color:#475569;}
body.theme-light .logo-text{background:linear-gradient(135deg,#1e293b,#334155);-webkit-background-clip:text;background-clip:text;}
body.theme-light .calc-display{background:rgba(15,23,42,0.88);}
body.theme-light .history-item{background:rgba(30,41,59,0.88);}
body.theme-light .history-item:hover{background:rgba(51,65,85,0.92);}
</style>
</head>
<body>

<div id="scr-sci" class="screen active">
    <div class="header">
        <div class="logo">
            <div class="logo-icon">∑</div>
            <div class="logo-text">Multi<span>Calc</span></div>
        </div>
        <div class="subtitle t-header-sub">Math • Physics • Units • Currency</div>
    </div>
    <button class="back-btn" type="button">← <span class="t-back">Πίσω</span></button>
    <button class="history-btn" onclick="toggleHistory('sci')">📜 History</button>
    <div id="history-sci" class="history-panel"></div>

    <div class="calc-display">
        <div class="calc-value" id="sci-res">0</div>
    </div>

    <div class="sci-grid">
        <button class="btn-sci" onclick="appendSci('RAD')">RAD</button>
        <button class="btn-sci" onclick="appendSci('sin(')">sin</button>
        <button class="btn-sci" onclick="appendSci('cos(')">cos</button>
        <button class="btn-sci" onclick="appendSci('tan(')">tan</button>
        <button class="btn-sci" onclick="appendSci('π')">π</button>
        <button class="btn-sci" onclick="appendSci('e')">e</button>
        <button class="btn-sci" onclick="appendSci('log(')">log</button>
        <button class="btn-sci" onclick="appendSci('ln(')">ln</button>
        <button class="btn-sci" onclick="appendSci('√(')">√</button>
        <button class="btn-sci" onclick="appendSci('∛(')">∛</button>
        <button class="btn-sci" onclick="appendSci('^2')">x²</button>
        <button class="btn-sci" onclick="appendSci('^3')">x³</button>
        <button class="btn-sci" onclick="appendSci('^')">x^y</button>
        <button class="btn-sci" onclick="appendSci('1/')">1/x</button>
        <button class="btn-sci" onclick="appendSci('!')">n!</button>
        <button class="btn-sci" onclick="appendSci('|')">|x|</button>
    </div>

    <div class="calc-grid" style="margin-top:15px;">
        <button class="calc-btn btn-clear"    onclick="clearSci()">C</button>
        <button class="calc-btn btn-operator" onclick="appendSci('(')">(</button>
        <button class="calc-btn btn-operator" onclick="appendSci(')')">)</button>
        <button class="calc-btn btn-operator" onclick="appendSci('÷')">÷</button>
        <button class="calc-btn btn-number"   onclick="appendSci('7')">7</button>
        <button class="calc-btn btn-number"   onclick="appendSci('8')">8</button>
        <button class="calc-btn btn-number"   onclick="appendSci('9')">9</button>
        <button class="calc-btn btn-operator" onclick="appendSci('×')">×</button>
        <button class="calc-btn btn-number"   onclick="appendSci('4')">4</button>
        <button class="calc-btn btn-number"   onclick="appendSci('5')">5</button>
        <button class="calc-btn btn-number"   onclick="appendSci('6')">6</button>
        <button class="calc-btn btn-operator" onclick="appendSci('-')">-</button>
        <button class="calc-btn btn-number"   onclick="appendSci('1')">1</button>
        <button class="calc-btn btn-number"   onclick="appendSci('2')">2</button>
        <button class="calc-btn btn-number"   onclick="appendSci('3')">3</button>
        <button class="calc-btn btn-operator" onclick="appendSci('+')">+</button>
        <button class="calc-btn btn-number"   onclick="appendSci('0')">0</button>
        <button class="calc-btn btn-number"   onclick="appendSci('.')">.</button>
        <button class="calc-btn btn-operator" style="background:#475569;color:white;" onclick="delCharSci()">⌫</button>
        <button class="calc-btn btn-equals"   onclick="solveSci()">=</button>
    </div>

    <div class="fun-facts-slot"></div>
</div>

<script>
/* ── Light-theme contrast guard ─────────────────────────────
   Detects whether the currently active body background is a
   light color (any theme, present or future) and toggles
   body.theme-light so panels/text/back-btn switch to a closed,
   readable palette. getComputedStyle always normalizes colors
   to rgb()/rgba() — never hex — so we parse that, not hex.
   Fully-transparent stops (alpha 0, e.g. body's own unset
   background-color) are skipped so they don't drag the
   average down as if they were a real black stop.
   A MutationObserver on body's style attribute acts as the
   "signal": whenever ANYTHING changes the body background
   (theme picker, app boot, future code), every already-loaded
   module reacts instantly, with no fixed timing assumptions. */
function mcRelLuminanceRGB(r,g,b){
    const lin=c=>{c/=255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);};
    return 0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b);
}
function mcExtractRGB(str){
    const out=[];
    (str.match(/rgba?\([^)]+\)/g)||[]).forEach(m=>{
        const n=m.match(/[\d.]+/g).map(Number);
        if(n.length>=4 && n[3]===0) return;
        out.push([n[0],n[1],n[2]]);
    });
    (str.match(/#[0-9a-fA-F]{6}/g)||[]).forEach(h=>{
        out.push([parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);
    });
    return out;
}
function mcCheckThemeLightness(){
    const cs=getComputedStyle(document.body);
    const str=(cs.backgroundImage&&cs.backgroundImage!=='none'?cs.backgroundImage:'')+' '+cs.backgroundColor;
    const colors=mcExtractRGB(str);
    if(!colors.length){document.body.classList.remove('theme-light');return;}
    const avg=colors.reduce((s,[r,g,b])=>s+mcRelLuminanceRGB(r,g,b),0)/colors.length;
    document.body.classList.toggle('theme-light',avg>0.18);
}
mcCheckThemeLightness();
window.addEventListener('load',mcCheckThemeLightness);
setTimeout(mcCheckThemeLightness,300);
try{
    new MutationObserver(mcCheckThemeLightness)
        .observe(document.body,{attributes:true,attributeFilter:['style','class']});
}catch(e){}

    var MultiCalc = {
        state: { sciExpr:"", calcHistory:{ std:[], sci:[] }, currentLang:'el' },
        data:  { translations: {
            el:{ history:'Ιστορικό', clear:'Καθαρισμός', confirmClear:'Καθαρισμός ιστορικού;' },
            en:{ history:'History',  clear:'Clear',       confirmClear:'Clear all history?' }
        }}
    };

    function appendSci(val) {
        if (MultiCalc.state.sciExpr==="0"||MultiCalc.state.sciExpr==="Error") MultiCalc.state.sciExpr="";
        MultiCalc.state.sciExpr += val;
        document.getElementById('sci-res').innerText = MultiCalc.state.sciExpr||"0";
    }
    function clearSci() { MultiCalc.state.sciExpr=""; document.getElementById('sci-res').innerText="0"; }
    function delCharSci() {
        MultiCalc.state.sciExpr = MultiCalc.state.sciExpr.slice(0,-1);
        document.getElementById('sci-res').innerText = MultiCalc.state.sciExpr||"0";
    }
    function factorial(n) {
        if (n<0||!Number.isInteger(n)) return NaN;
        if (n===0||n===1) return 1;
        let r=1; for(let i=2;i<=n;i++) r*=i; return r;
    }
    function solveSci() {
        const prev = MultiCalc.state.sciExpr;
        try {
            let e = MultiCalc.state.sciExpr
                .replace(/×/g,'*').replace(/÷/g,'/').replace(/π/g,'Math.PI').replace(/e/g,'Math.E')
                .replace(/sin\(/g,'Math.sin(').replace(/cos\(/g,'Math.cos(').replace(/tan\(/g,'Math.tan(')
                .replace(/log\(/g,'Math.log10(').replace(/ln\(/g,'Math.log(')
                .replace(/√\(/g,'Math.sqrt(').replace(/∛\(/g,'Math.cbrt(')
                .replace(/\^/g,'**').replace(/(\d+)!/g,(_,n)=>factorial(parseInt(n)));
            const result = eval(e);
            if (!isFinite(result)) { MultiCalc.state.sciExpr="Error"; }
            else { MultiCalc.state.sciExpr = parseFloat(result.toPrecision(15)).toString(); }
            document.getElementById('sci-res').innerText = MultiCalc.state.sciExpr;
            addToHistory('sci', prev, MultiCalc.state.sciExpr);
        } catch {
            document.getElementById('sci-res').innerText="Error";
            MultiCalc.state.sciExpr="";
        }
    }
    function addToHistory(type,expression,result) {
        if (!expression||!result||result==="Error") return;
        MultiCalc.state.calcHistory[type].unshift({expr:expression,result,time:Date.now()});
        if (MultiCalc.state.calcHistory[type].length>20) MultiCalc.state.calcHistory[type].pop();
        updateHistoryPanel(type);
        try { localStorage.setItem('mc_history',JSON.stringify(MultiCalc.state.calcHistory)); } catch(e){}
    }
    function updateHistoryPanel(type) {
        const panel = document.getElementById(`history-${type}`); if (!panel) return;
        const t = MultiCalc.data.translations[MultiCalc.state.currentLang]||MultiCalc.data.translations['en'];
        if (!MultiCalc.state.calcHistory[type].length) { panel.innerHTML='<div style="color:#94a3b8;text-align:center;padding:20px;">No history yet</div>'; return; }
        panel.innerHTML=`<div class="history-title"><span>${t.history}</span><button class="history-clear" onclick="clearHistory('${type}')">${t.clear}</button></div>`+
        MultiCalc.state.calcHistory[type].map(i=>`<div class="history-item" onclick="loadFromHistory('sci','${i.expr.replace(/'/g,"\\'")}')"><div class="history-expr">${i.expr}</div><div class="history-result">= ${i.result}</div></div>`).join('');
    }
    function toggleHistory(type) { const p=document.getElementById(`history-${type}`); if(p) p.classList.toggle('show'); }
    function clearHistory(type) {
        const t=MultiCalc.data.translations[MultiCalc.state.currentLang]||MultiCalc.data.translations['en'];
        if(confirm(t.confirmClear)) { MultiCalc.state.calcHistory[type]=[]; updateHistoryPanel(type); try{localStorage.setItem('mc_history',JSON.stringify(MultiCalc.state.calcHistory));}catch(e){} }
    }
    function loadFromHistory(type,histExpr) {
        MultiCalc.state.sciExpr=histExpr;
        document.getElementById('sci-res').innerText=histExpr;
        toggleHistory(type);
    }
    try { const s=localStorage.getItem('mc_history'); if(s){MultiCalc.state.calcHistory=JSON.parse(s);updateHistoryPanel('sci');} } catch(e){}
</script>
</body>
</html>
