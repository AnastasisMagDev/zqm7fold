<style>
/* ── SHARED BASE CSS ── */
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;}
html{background:#0f172a;min-height:100%;}

body::before,body::after{content:'';position:fixed;border-radius:50%;pointer-events:none;z-index:0;}

body::after{width:360px;height:360px;background:radial-gradient(circle,rgba(168,85,247,0.07) 0%,transparent 70%);bottom:40px;right:-60px;}

.screen.active{display:block;animation:screenIn 0.5s cubic-bezier(0.2,0.8,0.2,1) both;}

<script>
/* ── Light-theme contrast guard ─────────────────────────────
   Detects whether the currently active body background is a
   light color (any theme, present or future) and toggles
   body.theme-light so panels/text/back-btn switch to a closed,
   readable palette. getComputedStyle always normalizes colors
   to rgb()/rgba() — never hex — so we parse that, not hex.
   Fully-transparent stops (alpha 0, e.g. body's own unset
   background-color) are skipped so they don't drag the
   average down as if they were a real black stop.
   A MutationObserver on body's style attribute acts as the
   "signal": whenever ANYTHING changes the body background
   (theme picker, app boot, future code), every already-loaded
   module reacts instantly, with no fixed timing assumptions. */
function mcRelLuminanceRGB(r,g,b){
    const lin=c=>{c/=255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);};
    return 0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b);
}
function mcExtractRGB(str){
    const out=[];
    (str.match(/rgba?\([^)]+\)/g)||[]).forEach(m=>{
        const n=m.match(/[\d.]+/g).map(Number);
        if(n.length>=4 && n[3]===0) return;
        out.push([n[0],n[1],n[2]]);
    });
    (str.match(/#[0-9a-fA-F]{6}/g)||[]).forEach(h=>{
        out.push([parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);
    });
    return out;
}
function mcCheckThemeLightness(){
    const cs=getComputedStyle(document.body);
    const str=(cs.backgroundImage&&cs.backgroundImage!=='none'?cs.backgroundImage:'')+' '+cs.backgroundColor;
    const colors=mcExtractRGB(str);
    if(!colors.length){document.body.classList.remove('theme-light');return;}
    const avg=colors.reduce((s,[r,g,b])=>s+mcRelLuminanceRGB(r,g,b),0)/colors.length;
    document.body.classList.toggle('theme-light',avg>0.18);
}
mcCheckThemeLightness();
window.addEventListener('load',mcCheckThemeLightness);
setTimeout(mcCheckThemeLightness,300);
try{
    new MutationObserver(mcCheckThemeLightness)
        .observe(document.body,{attributes:true,attributeFilter:['style','class']});
}catch(e){}

/* ── i18n — same self-contained per-module pattern as MODULE-09/10 ── */
function PT(key, fallback){
    return (typeof T === 'function') ? T(key) : fallback;
}
function PT_currentLang(){
    return (typeof MultiCalc !== 'undefined' && MultiCalc.state) ? MultiCalc.state.currentLang : 'el';
}
var BMI_LOCALE = {el:'el-GR', en:'en-US', es:'es-ES'};
function currentLocale(){ return BMI_LOCALE[PT_currentLang()] || 'en-US'; }

var BMI_STATIC = [
    ['#bmi-persistent-disclaimer', 'bmiPersistentDisclaimer', '⚕️ Ενημερωτικό εργαλείο — δεν αντικαθιστά ιατρική συμβουλή.'],

    ['label[for="bmi-age"]', 'bmiAge', 'Ηλικία'],
    ['label[for="bmi-gender"]', 'bmiGender', 'Φύλο'],

    ['#bmi-activity-label', 'bmiActivityLabel', 'Επίπεδο Δραστηριότητας'],

    ['#bmi-opt-act0', 'bmiActSedentary', 'Καθιστική ζωή (καθόλου/ελάχιστη άσκηση)'],
    ['#bmi-opt-act1', 'bmiActLight', 'Ελαφριά άσκηση (1–3 ημέρες/εβδ.)'],
    ['#bmi-opt-act2', 'bmiActModerate', 'Μέτρια άσκηση (3–5 ημέρες/εβδ.)'],
    ['#bmi-opt-act3', 'bmiActIntense', 'Έντονη άσκηση (6–7 ημέρες/εβδ.)'],
    ['#bmi-opt-act4', 'bmiActVeryIntense', 'Πολύ έντονη (αθλητής / σωματική εργασία)'],
    ['#bmi-waist-label', 'bmiWaistLabel', 'Περίμετρος Μέσης (cm)'],
    ['#bmi-hip-label', 'bmiHipLabel', 'Περίμετρος Ισχίων (cm)'],
    ['#bmi-waist-optional-1', 'bmiWaistOptional', '(προαιρετικό)'],
    ['#bmi-waist-optional-2', 'bmiWaistOptional', '(προαιρετικό)'],
    ['#bmi-legend-0', 'bmiCatUnder', 'Λιποβαρής <18.5'],
    ['#bmi-legend-1', 'bmiCatNormal', 'Φυσιολογικό 18.5–25'],
    ['#bmi-legend-2', 'bmiCatOver', 'Υπέρβαρος 25–30'],
    ['#bmi-legend-3', 'bmiCatObese1', 'Παχυσαρκία Ι 30–35'],
    ['#bmi-legend-4', 'bmiCatObese2', 'Παχυσαρκία ΙΙ 35–40'],
    ['#bmi-legend-5', 'bmiCatObese3', 'Παχυσαρκία ΙΙΙ >40']
];
var _bmiLastLang = null;
function applyBmiI18n(force){
    BMI_STATIC.forEach(function(row){
        var el = document.querySelector('#scr-bmi '+row[0]);
        if (el) el.innerText = PT(row[1], row[2]);
    });
    var lang = PT_currentLang();
    if (force || lang !== _bmiLastLang){
        calculateBMI();
        renderWeightHistory();
        _bmiLastLang = lang;
    }
}
/* Hook "user navigated to my screen" — same technique as MODULE-09/10. */
(function(){
    var _origNavTo = window.navTo;
    if (typeof _origNavTo === 'function') {
        window.navTo = function(id, isBack){
            _origNavTo(id, isBack);
            if (id === 'scr-bmi') applyBmiI18n(false);
        };

})();

/* ══════════════════════════════════════════════════════════════════════
   MODULE 08 — BMI & Health · Clinical-grade reference tool
   Formulas used (all peer-reviewed / internationally recognized):
   • BMI classification  — WHO adult cutoffs (8-tier) / CDC growth-chart
     age-and-sex cutoffs for youth 2–17
   • BMR                 — Mifflin-St Jeor equation (1990)
   • TDEE                — BMR × Harris-Benedict activity multiplier
   • Body Fat %          — Deurenberg et al. (1991) adult / youth formula
   • Ideal Body Weight    — Devine formula (1974)
   • Healthy weight range — BMI 18.5–25 (or age-specific cutoffs) × height²
   • Waist / WHR risk     — WHO waist-circumference and waist-to-hip cutoffs
   This tool provides realistic REFERENCE estimates. It is not a
   diagnostic device — see the disclaimer rendered with every result.
   ══════════════════════════════════════════════════════════════════════ */

function parseDecimal(s) {
    if (!s) return NaN;
    return parseFloat(s.toString().replace(',', '.').trim());
}

/* ── WHO adult BMI classification (8 tiers, ages ≥18) ── */
const ADULT_TIERS = [
    { max: 16,       key:'severe_thin' },
    { max: 17,       key:'mod_thin'    },
    { max: 18.5,     key:'mild_thin'   },
    { max: 25,       key:'normal'      },
    { max: 30,       key:'overweight'  },
    { max: 35,       key:'obese1'      },
    { max: 40,       key:'obese2'      },
    { max: Infinity, key:'obese3'      },
];
const TIER_COLOR = { severe_thin:'#3b82f6', mod_thin:'#60a5fa', mild_thin:'#93c5fd', normal:'#10b981',
                     overweight:'#f59e0b', obese1:'#f97316', obese2:'#ef4444', obese3:'#b91c1c' };
const TIER_EMOJI = { severe_thin:'🦴', mod_thin:'🦴', mild_thin:'🦴', normal:'✅',
                     overweight:'⚠️', obese1:'🔶', obese2:'🚨', obese3:'⛔' };
const TIER_NAME_KEY = { severe_thin:['bmiTierSevereThin','Σοβαρή Λιποβαρότητα'], mod_thin:['bmiTierModThin','Μέτρια Λιποβαρότητα'],
                        mild_thin:['bmiTierMildThin','Ήπια Λιποβαρότητα'], normal:['bmiTierNormal','Φυσιολογικό'],
                        overweight:['bmiTierOverweight','Υπέρβαρος'], obese1:['bmiTierObese1','Παχυσαρκία Βαθμού Ι'],
                        obese2:['bmiTierObese2','Παχυσαρκία Βαθμού ΙΙ'], obese3:['bmiTierObese3','Παχυσαρκία Βαθμού ΙΙΙ'] };
/* ── Category-specific guidance keys (risk + gender-aware plan) ── */
const TIER_CONTENT_KEYS = {
    severe_thin: { risk:['bmiRiskSevereThin','Σοβαρός κίνδυνος: ανοσοκαταστολή, αρρυθμίες, οστεοπόρωση, ορμονικές διαταραχές. Συνιστάται άμεση ιατρική αξιολόγηση.'],
                   planM:['bmiPlanSevereThinM','<b>Διατροφή:</b> Ιατρικά καθοδηγούμενος θερμιδικός στόχος, πρωτεΐνη 1.6–2 g/kg. <b>Άσκηση:</b> Μόνο κατόπιν ιατρικής έγκρισης.'],
                   planF:['bmiPlanSevereThinF','<b>Διατροφή:</b> Ιατρικά καθοδηγούμενος θερμιδικός στόχος, σίδηρος & ασβέστιο. <b>Άσκηση:</b> Μόνο κατόπιν ιατρικής έγκρισης.'] },
    mod_thin:    { risk:['bmiRiskModThin','Αυξημένος κίνδυνος αναιμίας, εξασθενημένου ανοσοποιητικού και οστεοπόρωσης.'],
                   planM:['bmiPlanModThinM','<b>Διατροφή:</b> Θερμιδικό πλεόνασμα ~300–500 kcal/ημέρα, υψηλή πρωτεΐνη. <b>Άσκηση:</b> Προπόνηση δύναμης 2–3×/εβδ.'],
                   planF:['bmiPlanModThinF','<b>Διατροφή:</b> Θερμιδικό πλεόνασμα, σίδηρος & ασβέστιο. <b>Άσκηση:</b> Ελαφριά προπόνηση δύναμης 2×/εβδ.'] },

                   planM:['bmiPlanNormalM','<b>Διατροφή:</b> Ισορροπημένα γεύματα, διατήρηση ενεργειακής ισορροπίας. <b>Άσκηση:</b> 150+ λεπτά/εβδ. αερόβια + δύναμη 2×/εβδ.'],
                   planF:['bmiPlanNormalF','<b>Διατροφή:</b> Ισορροπημένα γεύματα, επαρκές ασβέστιο. <b>Άσκηση:</b> 150+ λεπτά/εβδ. αερόβια + δύναμη 2×/εβδ.'] },
    overweight:  { risk:['bmiRiskOverweight','Αυξημένος κίνδυνος προ-διαβήτη, υπέρτασης και δυσλιπιδαιμίας.'],
                   planM:['bmiPlanOverweightM','<b>Διατροφή:</b> Έλλειμμα ~300–500 kcal/ημέρα, μείωση επεξεργασμένων τροφών. <b>Άσκηση:</b> 200–250 λεπτά/εβδ. αερόβια + δύναμη.'],
                   planF:['bmiPlanOverweightF','<b>Διατροφή:</b> Έλλειμμα ~300–500 kcal/ημέρα, μείωση ζάχαρης. <b>Άσκηση:</b> 200–250 λεπτά/εβδ. αερόβια + δύναμη.'] },
    obese1:      { risk:['bmiRiskObese1','Σημαντικά αυξημένος κίνδυνος διαβήτη τύπου 2, καρδιαγγειακής νόσου, άπνοιας ύπνου. Συνιστάται παρακολούθηση από ιατρό.'],
                   planM:['bmiPlanObese1M','<b>Διατροφή:</b> Δομημένο πρόγραμμα με ιατρική/διαιτολογική καθοδήγηση. <b>Άσκηση:</b> Σταδιακή αύξηση, ξεκινώντας με χαμηλή κρούση.'],
                   planF:['bmiPlanObese1F','<b>Διατροφή:</b> Δομημένο πρόγραμμα με ιατρική/διαιτολογική καθοδήγηση. <b>Άσκηση:</b> Σταδιακή αύξηση, χαμηλή κρούση αρχικά.'] },
    obese2:      { risk:['bmiRiskObese2','Υψηλός κίνδυνος σοβαρών επιπλοκών (καρδιαγγειακά, διαβήτης, αναπνευστικά). Συνιστάται στενή ιατρική παρακολούθηση.'],
                   planM:['bmiPlanObese2','<b>Διατροφή/Άσκηση:</b> Να σχεδιαστούν αποκλειστικά από ιατρό/διαιτολόγο· πιθανή αξιολόγηση για φαρμακευτική ή χειρουργική επιλογή.'],
                   planF:['bmiPlanObese2','<b>Διατροφή/Άσκηση:</b> Να σχεδιαστούν αποκλειστικά από ιατρό/διαιτολόγο· πιθανή αξιολόγηση για φαρμακευτική ή χειρουργική επιλογή.'] },
    obese3:      { risk:['bmiRiskObese3','Πολύ υψηλός κίνδυνος απειλητικών για τη ζωή επιπλοκών. Απαιτείται άμεση, εξειδικευμένη ιατρική φροντίδα.'],
                   planM:['bmiPlanObese3','<b>Σημαντικό:</b> Αυτό το επίπεδο απαιτεί εξατομικευμένη ιατρική διαχείριση. Συμβουλευτείτε ιατρό άμεσα για πλήρη αξιολόγηση.'],
                   planF:['bmiPlanObese3','<b>Σημαντικό:</b> Αυτό το επίπεδο απαιτεί εξατομικευμένη ιατρική διαχείριση. Συμβουλευτείτε ιατρό άμεσα για πλήρη αξιολόγηση.'] },
};
function getTierContent(tierKey){
    const k = TIER_CONTENT_KEYS[tierKey] || TIER_CONTENT_KEYS.normal;
    return { risk: PT(k.risk[0], k.risk[1]), planM: PT(k.planM[0], k.planM[1]), planF: PT(k.planF[0], k.planF[1]) };
}
function tierName(tierKey){
    const k = TIER_NAME_KEY[tierKey] || TIER_NAME_KEY.normal;
    return PT(k[0], k[1]);
}

/* ── CDC-style youth cutoffs (ages 2–17), age- and sex-specific ── */
function youthCutoffs(age, isFemale) {
    const table = {
        male:   {2:[14.7,17.4,18.0],3:[14.3,17.0,17.7],4:[13.9,16.7,17.6],5:[13.8,16.6,17.7],
                 6:[13.8,16.8,18.0],7:[13.8,17.2,18.7],8:[14.0,17.8,19.6],9:[14.3,18.6,20.7],
                 10:[14.6,19.4,21.8],11:[15.0,20.2,22.9],12:[15.5,21.0,24.0],13:[16.0,21.7,24.9],
                 14:[16.6,22.4,25.7],15:[17.2,23.1,26.5],16:[17.7,23.7,27.1],17:[18.2,24.2,27.6]},
        female: {2:[14.2,17.1,17.8],3:[13.9,16.7,17.6],4:[13.6,16.5,17.6],5:[13.5,16.6,17.8],
                 6:[13.5,16.9,18.3],7:[13.7,17.5,19.1],8:[14.0,18.3,20.2],9:[14.4,19.2,21.4],
                 10:[14.9,20.1,22.6],11:[15.5,21.0,23.7],12:[16.1,21.8,24.7],13:[16.7,22.6,25.6],
                 14:[17.2,23.2,26.3],15:[17.6,23.7,26.9],16:[17.9,24.0,27.3],17:[18.2,24.3,27.6]}
    };
    const row = table[isFemale ? 'female' : 'male'][Math.min(17, Math.max(2, age))];
    return row || [15.0, 22.0, 25.0];
}

/* ── Single source of truth for gauge positioning (BMI 15–45 → 0–100%). ── */
function bmiToPct(bmi) {
    return Math.max(0, Math.min(100, ((bmi - 15) / (45 - 15)) * 100));
}
function buildGaugeGradient(breakpoints, colors, feather) {
    feather = feather === undefined ? 0.9 : feather;
    var pcts = breakpoints.map(bmiToPct);
    var edges = [0].concat(pcts).concat([100]);
    var minGap = Infinity;
    for (var g = 1; g < edges.length; g++) minGap = Math.min(minGap, edges[g] - edges[g - 1]);
    var safeFeather = Math.min(feather, Math.max(0.05, minGap * 0.4));
    var stops = [colors[0] + ' 0%'];
    for (var i = 0; i < pcts.length; i++) {
        var lo = Math.max(0, pcts[i] - safeFeather).toFixed(3) + '%';
        var hi = Math.min(100, pcts[i] + safeFeather).toFixed(3) + '%';
        stops.push(colors[i] + ' ' + lo);
        stops.push(colors[i + 1] + ' ' + hi);
    }
    stops.push(colors[colors.length - 1] + ' 100%');
    return 'linear-gradient(90deg,' + stops.join(',') + ')';
}
const ADULT_GAUGE_GRADIENT = buildGaugeGradient(
    [16, 17, 18.5, 25, 30, 35, 40],
    ['#3b82f6', '#60a5fa', '#93c5fd', '#10b981', '#f59e0b', '#f97316', '#ef4444', '#b91c1c']
);

/* ── Waist-circumference / WHR risk (WHO cutoffs) ── */
function waistRisk(waist, isFemale){
    const cuts = isFemale ? [80,88] : [94,102];
    if (waist < cuts[0]) return {key:'bmiRiskLow', color:'#10b981'};
    if (waist < cuts[1]) return {key:'bmiRiskIncreased', color:'#f59e0b'};
    return {key:'bmiRiskHigh', color:'#ef4444'};
}
function whrRisk(whr, isFemale){
    const cut = isFemale ? 0.85 : 0.90;
    return whr < cut ? {key:'bmiRiskLow', color:'#10b981'} : {key:'bmiRiskHigh', color:'#ef4444'};
}

function bmiSubcard(color, label, value, sub){
    return `<div class="bmi-subcard"><div class="lbl" style="color:${color};">${label}</div><div class="val" style="color:${color};">${value}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`;
}

function calculateBMI() {
    const weight    = parseDecimal(document.getElementById('bmi-weight').value);
    const heightVal = parseDecimal(document.getElementById('bmi-height').value);
    const age       = parseInt(document.getElementById('bmi-age').value) || 25;
    const gender    = document.getElementById('bmi-gender').value;
    const isFemale  = gender === 'female';
    const activityMultiplier = parseFloat(document.getElementById('bmi-activity').value) || 1.55;
    const waist     = parseDecimal(document.getElementById('bmi-waist')?.value);
    const hip       = parseDecimal(document.getElementById('bmi-hip')?.value);

    const resultDiv = document.getElementById('bmi-result');
    const indicator = document.getElementById('bmi-indicator');

    if (isNaN(weight) || isNaN(heightVal) || weight <= 0 || heightVal <= 0) {
        resultDiv.style.display = 'none';
        if (indicator) indicator.style.left = '0%';
        return;
    }

    let heightM = heightVal < 3 ? heightVal : heightVal / 100;
    if (heightM <= 0 || heightM > 2.7 || weight > 700) { resultDiv.style.display = 'none'; return; }

    const bmi = weight / (heightM * heightM);
    const isYouth = age >= 2 && age < 18;
    const youthCuts = isYouth ? youthCutoffs(age, isFemale) : null;

    /* ── Classification ── */
    let tierKey, tierNameStr, tierColor, tierEmoji;
    if (isYouth) {
        const [cutLow, cutNormal, cutOver] = youthCuts;
        if (bmi < cutLow)         { tierKey='mild_thin';  tierNameStr=PT('bmiYouthThin','Λιποβαρής (ηλικιακό)');       tierColor='#60a5fa'; tierEmoji='🦴'; }
        else if (bmi < cutNormal){ tierKey='normal';      tierNameStr=PT('bmiTierNormal','Φυσιολογικό');               tierColor='#10b981'; tierEmoji='✅'; }
        else if (bmi < cutOver)  { tierKey='overweight';  tierNameStr=PT('bmiYouthOverweight','Υπέρβαρος (ηλικιακό)'); tierColor='#f59e0b'; tierEmoji='⚠️'; }
        else                      { tierKey='obese1';      tierNameStr=PT('bmiYouthObese','Παχυσαρκία (ηλικιακό)');     tierColor='#ef4444'; tierEmoji='🚨'; }
    } else {
        const tier = ADULT_TIERS.find(t => bmi < t.max);
        tierKey = tier.key; tierNameStr = tierName(tierKey); tierColor = TIER_COLOR[tierKey]; tierEmoji = TIER_EMOJI[tierKey];
    }
    const content = getTierContent(tierKey);

    /* ── BMR — Mifflin-St Jeor (1990) ── */
    let bmr = (10 * weight) + (6.25 * heightM * 100) - (5 * age);
    bmr = isFemale ? bmr - 161 : bmr + 5;
    bmr = Math.max(bmr, 500);

    /* ── TDEE ── */
    const tdee = bmr * activityMultiplier;

    /* ── Body Fat % — Deurenberg et al. ── */
    let bodyFat = age >= 15
        ? (1.20 * bmi) + (0.23 * age) - (10.8 * (isFemale ? 0 : 1)) - 5.4
        : (1.51 * bmi) - (0.70 * age) + (isFemale ? 3.5 : 0) + 1.4;
    bodyFat = Math.max(3, Math.min(60, bodyFat));

    /* ── Ideal Body Weight — Devine formula (1974) ── */
    const heightInches = (heightM * 100) / 2.54;
    let idealWeight = heightM >= 1.52
        ? (isFemale ? 45.5 + 2.3 * (heightInches - 60) : 50.0 + 2.3 * (heightInches - 60))
        : 21.5 * heightM * heightM;
    if (isYouth) {
        const [cl, cn] = youthCuts;
        idealWeight = ((cl + cn) / 2) * heightM * heightM;
    }
    idealWeight = Math.max(idealWeight, 2);
    const weightDiff    = weight - idealWeight;
    const weightDiffPct = (weightDiff / weight) * 100;

    /* ── Healthy weight RANGE (not just a single ideal number) ── */
    let rangeLow, rangeHigh, rangeSubKey, rangeSubFallback;
    if (isYouth) {
        rangeLow = youthCuts[0] * heightM * heightM;
        rangeHigh = youthCuts[1] * heightM * heightM;
        rangeSubKey = 'bmiHealthyRangeSubYouth'; rangeSubFallback = 'βάσει ηλικιακών ορίων ΔΜΣ';
    } else {
        rangeLow = 18.5 * heightM * heightM;
        rangeHigh = 25 * heightM * heightM;
        rangeSubKey = 'bmiHealthyRangeSub'; rangeSubFallback = 'βάσει ΔΜΣ 18.5–25';
    }

    /* ── Waist circumference / WHR (only rendered if provided) ── */
    let waistHtml = '';
    if (!isNaN(waist) && waist > 0) {
        const wr = waistRisk(waist, isFemale);
        waistHtml += bmiSubcard(wr.color, PT('bmiWaistRiskLabel','Κίνδυνος βάσει Περιμέτρου Μέσης'), waist.toFixed(0)+' cm', PT(wr.key, wr.key)+' · '+PT('bmiWhoWaistNote','Όρια ΠΟΥ'));
        if (!isNaN(hip) && hip > 0) {
            const whr = waist / hip;
            const whrR = whrRisk(whr, isFemale);
            waistHtml += bmiSubcard(whrR.color, PT('bmiWhrRiskLabel','Κίνδυνος βάσει WHR'), whr.toFixed(2), PT(whrR.key, whrR.key)+' · '+PT('bmiWhoWaistNote','Όρια ΠΟΥ'));
        }
    }

    /* ── Gauge ── */
    const gaugeTrack = document.getElementById('bmi-gauge');
    if (gaugeTrack) {
        gaugeTrack.style.background = isYouth
            ? buildGaugeGradient(youthCuts, ['#60a5fa', '#10b981', '#f59e0b', '#ef4444'])
            : ADULT_GAUGE_GRADIENT;
    }
    const gaugePos = bmiToPct(bmi);
    if (indicator) {
        indicator.style.left = gaugePos + '%';
        indicator.style.background = tierColor;
        indicator.style.boxShadow = `0 0 15px ${tierColor}`;
    }

    const genderSymbol = isFemale ? '♀' : '♂';
    const genderLabel = genderSymbol + ' ' + PT(isFemale ? 'bmiFemale' : 'bmiMale', isFemale ? 'Γυναίκα' : 'Άνδρας');

    /* ── Geriatric guidance note (age ≥ 65) ── */
    const seniorNote = age >= 65 ? `
        <div style="background:rgba(99,102,241,0.08);border:1px solid rgba(99,102,241,0.22);border-radius:12px;padding:11px 13px;text-align:left;font-size:0.76rem;line-height:1.5;color:#c7d2fe;">
            <b>${PT('bmiSeniorNoteLabel','ℹ️ Γηριατρική σημείωση (65+ ετών):')}</b> ${PT('bmiSeniorNoteBody','Ερευνητικά δεδομένα σε ηλικιωμένους πληθυσμούς συσχετίζουν ένα ελαφρώς υψηλότερο ΔΜΣ (περίπου 23–30) με καλύτερη έκβαση υγείας και μεγαλύτερα ενεργειακά αποθέματα σε περίπτωση ασθένειας. Η ταξινόμηση του ΠΟΥ παραπάνω αφορά τον γενικό ενήλικο πληθυσμό — για εξατομικευμένο εύρος-στόχο, συμβουλευτείτε γηρίατρο.')}
        </div>` : '';

    const tdeeSub = PT('bmiTdeeSubTemplate','TDEE · {mult}× δραστηριότητα').replace('{mult}', activityMultiplier);
    const devineFootnote = isYouth
        ? PT('bmiDevineFootnoteYouth','Devine formula (1974) — προσαρμοσμένο σε ηλικιακό εύρος')
        : PT('bmiDevineFootnoteAdult','Devine formula (1974), ανά φύλο');

    resultDiv.style.display = 'block';
    resultDiv.innerHTML = `
        <div style="display:flex;flex-direction:column;gap:12px;text-align:center;">

            <div style="background:rgba(255,243,199,0.08);color:#fde68a;padding:12px 13px;border-radius:12px;font-size:0.72rem;line-height:1.55;border:1px solid rgba(252,211,77,0.22);text-align:left;">
                <b>${PT('bmiAccuracyNote','⚕️ Σημείωση ακρίβειας: Η εκτίμηση βασίζεται σε καθιερωμένους επιστημονικούς τύπους (ΠΟΥ, Mifflin-St Jeor, Deurenberg, Devine) και αντικατοπτρίζει ρεαλιστικές τιμές αναφοράς. Δεν αποτελεί ιατρική διάγνωση. Για ακριβή αξιολόγηση της σύστασης σώματος και εξατομικευμένη καθοδήγηση υγείας, συμβουλευτείτε ιατρό, διαιτολόγο ή άλλον αρμόδιο επαγγελματία υγείας.')}</b>
            </div>

            ${isYouth ? `<div style="background:rgba(99,102,241,0.1);color:#a5b4fc;padding:7px 10px;border-radius:10px;font-size:0.68rem;border:1px solid rgba(99,102,241,0.22);">${PT('bmiYouthBadge','📊 Παιδικό/εφηβικό ΔΜΣ — όρια CDC growth chart, ηλικίας &amp; φύλου')}</div>` : ''}

            <div>
                <div style="font-size:3.5rem;font-weight:800;color:${tierColor};line-height:1;">${bmi.toFixed(1)}</div>
                <div style="font-size:1.25rem;margin-top:5px;font-weight:700;color:${tierColor};">${tierEmoji} ${tierNameStr}</div>
                <div style="font-size:0.78rem;margin-top:4px;opacity:0.65;">${genderLabel} · ${PT('bmiAge','Ηλικία')} ${age}${!isYouth ? ' · ' + PT('bmiWhoClassification','Κατάταξη ΠΟΥ') : ''}</div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                <div class="bmi-subcard">
                    <div class="lbl" style="color:#ff4d4d;">${PT('bmiBmrLabel','Βασικός Μεταβολισμός')}</div>
                    <div class="val" style="color:#ff5c5c;">${Math.round(bmr)} kcal</div>
                    <div class="sub">${PT('bmiBmrSub','Mifflin-St Jeor · ημερησίως σε ηρεμία')}</div>
                </div>
                <div class="bmi-subcard">
                    <div class="lbl" style="color:#fb923c;">${PT('bmiTdeeLabel','Θερμίδες Συντήρησης')}</div>
                    <div class="val" style="color:#fb923c;">${Math.round(tdee)} kcal</div>
                    <div class="sub">${tdeeSub}</div>
                </div>
            </div>

            <div style="display:grid;grid-template-columns:1fr;gap:10px;">
                <div class="bmi-subcard">
                    <div class="lbl" style="color:#00d2ff;">${PT('bmiBodyFatLabel','Εκτιμώμενο Ποσοστό Λίπους')}</div>
                    <div class="val" style="color:#00d2ff;">${bodyFat.toFixed(1)}%</div>
                    <div class="sub">${PT('bmiBodyFatSub','Τύπος Deurenberg')}${isYouth ? ' ' + PT('bmiYouthVariant','(εφηβική παραλλαγή)') : ''}</div>
                </div>
            </div>

            <div style="background:rgba(255,255,255,0.03);border-radius:12px;padding:12px;border:1px solid rgba(255,255,255,0.05);text-align:left;">
                <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:0.92rem;">
                    <span style="opacity:0.8;font-weight:600;">${PT('bmiHealthyRangeLabel','Υγιές Εύρος Βάρους')}:</span>
                    <span style="font-weight:900;color:#22d3ee;">${rangeLow.toFixed(1)}–${rangeHigh.toFixed(1)} kg</span>
                </div>
                <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:0.92rem;">
                    <span style="opacity:0.8;font-weight:600;">${PT('bmiIdealWeightLabel','Ιδανικό Βάρος (Devine):')}</span>
                    <span style="font-weight:900;color:#00ff66;">${idealWeight.toFixed(1)} kg</span>
                </div>
                <div style="display:flex;justify-content:space-between;font-size:0.92rem;">
                    <span style="opacity:0.8;font-weight:600;">${PT('bmiWeightDiffLabel','Διαφορά από ιδανικό:')}</span>
                    <span style="font-weight:900;color:${weightDiff > 0 ? '#ff5c5c' : '#3399ff'};">
                        ${weightDiff > 0 ? '+' : ''}${weightDiff.toFixed(1)} kg (${weightDiff > 0 ? '+' : ''}${weightDiffPct.toFixed(1)}%)
                    </span>
                </div>
                <div style="font-size:0.62rem;opacity:0.45;margin-top:6px;">${devineFootnote} · ${PT(rangeSubKey, rangeSubFallback)}</div>
            </div>

            ${waistHtml ? `<div style="display:grid;grid-template-columns:${hip>0?'1fr 1fr':'1fr'};gap:10px;">${waistHtml}</div>` : ''}

            ${seniorNote}

            <div style="background:rgba(239,68,68,0.05);padding:12px;border-radius:12px;text-align:left;border:1px solid rgba(239,68,68,0.1);">
                <div style="font-size:0.68rem;font-weight:700;color:#ef4444;text-transform:uppercase;margin-bottom:5px;">${PT('bmiClinicalSigLabel','Κλινική Σημασία')}</div>
                <div style="font-size:0.84rem;line-height:1.5;">${content.risk}</div>
            </div>

            <div style="background:rgba(16,185,129,0.05);padding:12px;border-radius:12px;text-align:left;border:1px solid rgba(16,185,129,0.1);">
                <div style="font-size:0.68rem;font-weight:700;color:#10b981;text-transform:uppercase;margin-bottom:5px;">${PT('bmiActionPlanLabel','Σχέδιο Δράσης')} · ${genderLabel}</div>
                <div style="font-size:0.84rem;line-height:1.5;">${isFemale ? content.planF : content.planM}</div>
            </div>

        </div>`;
}

/* ══════════════════════════════════════════════════════════════════════
   Weight history — localStorage-based tracking + a hand-rolled SVG
   trend chart. This is the one thing a chat conversation can never
   offer on its own: data that's still there next time you open the app.
   ══════════════════════════════════════════════════════════════════════ */
var BMI_HISTORY_KEY = 'multicalc_bmi_weight_history';

function todayLocalStr(){
    var d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function parseLocalDateStr(val){
    var p = val.split('-');
    return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
}
function loadWeightHistory(){
    try { var v = JSON.parse(localStorage.getItem(BMI_HISTORY_KEY) || '[]'); return Array.isArray(v) ? v : []; }
    catch(e){ return []; }
}
function saveWeightHistory(list){
    try { localStorage.setItem(BMI_HISTORY_KEY, JSON.stringify(list)); } catch(e){}
}
function logWeight(){
    var w = parseDecimal(document.getElementById('bmi-weight').value);
    if (isNaN(w) || w <= 0) return;
    var today = todayLocalStr();
    var list = loadWeightHistory();
    var idx = list.findIndex(function(e){ return e.date === today; });
    if (idx >= 0) list[idx].weight = w; else list.push({date:today, weight:w});
    list.sort(function(a,b){ return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
    saveWeightHistory(list);
    renderWeightHistory();
}
function deleteWeightEntry(date){
    saveWeightHistory(loadWeightHistory().filter(function(e){ return e.date !== date; }));
    renderWeightHistory();
}
function clearWeightHistory(){
    if (!confirm(PT('bmiHistoryConfirmClear','Διαγραφή όλου του ιστορικού βάρους;'))) return;
    saveWeightHistory([]);
    renderWeightHistory();
}
function renderWeightChart(entries){
    if (entries.length < 2) return '';
    var w=280, h=90, pad=8;
    var weights = entries.map(function(e){ return e.weight; });
    var minW = Math.min.apply(null, weights), maxW = Math.max.apply(null, weights);
    if (minW === maxW){ minW -= 1; maxW += 1; }
    var n = entries.length;
    var pts = entries.map(function(e,i){
        var x = pad + (i/(n-1))*(w-2*pad);
        var y = h-pad - ((e.weight-minW)/(maxW-minW))*(h-2*pad);
        return [x.toFixed(1), y.toFixed(1)];
    });
    var line = pts.map(function(p){ return p.join(','); }).join(' ');
    var dots = pts.map(function(p){ return `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#818cf8"/>`; }).join('');
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:90px;display:block;" role="img"><polyline points="${line}" fill="none" stroke="#818cf8" stroke-width="2"/>${dots}</svg>`;
}
function renderWeightHistory(){
    var container = document.getElementById('bmi-history-container');
    if (!container) return;
    var list = loadWeightHistory();
    var html = `<div class="bmi-history-header"><div class="bmi-history-title">${PT('bmiHistoryTitle','Ιστορικό Βάρους')}</div><button type="button" class="bmi-log-btn" onclick="logWeight()">${PT('bmiLogWeightBtn','Καταγραφή Βάρους')}</button></div>`;
    if (list.length === 0){
        html += `<div style="opacity:0.5;font-size:0.85rem;">${PT('bmiHistoryEmpty','Δεν υπάρχουν ακόμη καταχωρήσεις.')}</div>`;
    } else {
        html += renderWeightChart(list);
        var change = list[list.length-1].weight - list[0].weight;
        html += `<div style="font-size:0.75rem;opacity:0.65;margin:6px 0 10px;">${PT('bmiHistoryChangeSince','Μεταβολή από την πρώτη καταχώρηση')}: ${change>0?'+':''}${change.toFixed(1)} kg</div>`;
        html += '<div style="max-height:180px;overflow-y:auto;">' + list.slice().reverse().map(function(e){
            var dateStr = parseLocalDateStr(e.date).toLocaleDateString(currentLocale());
            return `<div class="bmi-history-row"><span>${dateStr}</span><span style="font-weight:700;">${e.weight} kg</span><span class="del" onclick="deleteWeightEntry('${e.date}')">✕</span></div>`;
        }).join('') + '</div>';
        html += `<button type="button" class="bmi-history-clear-btn" onclick="clearWeightHistory()">${PT('bmiHistoryClear','Καθαρισμός Ιστορικού')}</button>`;
    }
    container.innerHTML = html;
}

// Init on load
applyBmiI18n(true);
renderWeightHistory();
_bmiLastLang = PT_currentLang();
</script>
