<style>
/* ── SHARED BASE CSS ── */
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;}
html{background:#0f172a;min-height:100%;}
body{background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#1a1f3a 100%);min-height:100dvh;min-height:100vh;color:white;overflow-x:hidden;}
body::before,body::after{content:'';position:fixed;border-radius:50%;pointer-events:none;z-index:0;}
body::before{width:420px;height:420px;background:radial-gradient(circle,rgba(99,102,241,0.09) 0%,transparent 70%);top:-80px;left:-80px;}
body::after{width:360px;height:360px;background:radial-gradient(circle,rgba(168,85,247,0.07) 0%,transparent 70%);bottom:40px;right:-60px;}
.is-animating{pointer-events:none!important;}

/* ── Screen transitions ── */
.screen{display:none;padding:20px;padding-bottom:100px;min-height:100dvh;min-height:100vh;position:relative;z-index:1;contain:layout style;}
.screen.active{display:block;animation:screenIn 0.5s cubic-bezier(0.2,0.8,0.2,1) both;}
.screen.active-back{display:block;animation:screenIn 0.5s cubic-bezier(0.2,0.8,0.2,1) both;}
.screen.exiting{display:block;animation:screenOut 0.5s cubic-bezier(0.2,0.8,0.2,1) both;}
@keyframes screenIn{from{opacity:0;transform:scale3d(0.96,0.96,1) translateY(10px);}to{opacity:1;transform:scale3d(1,1,1) translateY(0);}}
@keyframes screenOut{from{opacity:1;transform:scale3d(1,1,1) translateY(0);}to{opacity:0;transform:scale3d(0.96,0.96,1) translateY(-10px);}}

/* ── Header, Logo ── */
.header{text-align:center;padding:40px 20px 30px;}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:8px;justify-content:center;}
.logo-icon{width:48px;height:48px;background:linear-gradient(135deg,#6366f1,#a855f7);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.8rem;color:#fff;box-shadow:0 8px 24px rgba(99,102,241,0.3);position:relative;overflow:hidden;}
.logo-icon::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(45deg,transparent 30%,rgba(255,255,255,0.1) 50%,transparent 70%);animation:shimmer 3s infinite;}
@keyframes shimmer{0%{transform:translate(-100%,-100%);}100%{transform:translate(100%,100%);}}
.logo-text{font-size:2.5rem;font-weight:700;background:linear-gradient(135deg,#fff,#e2e8f0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.logo span{background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.subtitle{color:#94a3b8;font-size:0.95rem;margin-top:5px;}

/* ── Grid ── */
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;max-width:500px;margin:0 auto;}

/* ── Language Cards ── */
.lang-card{background:rgba(30,41,59,0.6);border:1px solid rgba(71,85,105,0.3);border-radius:20px;padding:30px 20px;text-align:center;cursor:pointer;transition:transform 0.25s cubic-bezier(0.34,1.56,0.64,1),background 0.2s ease,box-shadow 0.2s ease;backdrop-filter:blur(10px);position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation;animation:cardEntry 0.5s cubic-bezier(0.22,1,0.36,1) both;}
.lang-card:hover{background:rgba(51,65,85,0.7);border-color:rgba(139,92,246,0.4);box-shadow:0 12px 30px rgba(0,0,0,0.3),0 0 0 1px rgba(139,92,246,0.2);}
.lang-card:active{transform:scale(0.93)!important;transition:transform 0.08s ease!important;}
.lang-card .flag{font-size:3rem;margin-bottom:10px;display:block;transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);}
.lang-card:hover .flag{transform:scale(1.2);}
.lang-card .name{font-size:1.1rem;font-weight:500;}

/* ── Menu Cards ── */
.menu-card{border-radius:22px;padding:35px 20px;text-align:center;cursor:pointer;transition:transform 0.28s cubic-bezier(0.34,1.56,0.64,1),box-shadow 0.28s ease,filter 0.2s ease;border:none;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation;animation:cardEntry 0.5s cubic-bezier(0.22,1,0.36,1) both;}
.menu-card::before{content:'';position:absolute;inset:0;background:rgba(255,255,255,0);transition:background 0.2s ease;border-radius:inherit;}
.menu-card::after{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,0.14) 50%,transparent 70%);transition:left 0.5s ease;pointer-events:none;}
.menu-card:hover::after{left:150%;}
.menu-card:hover{box-shadow:0 22px 50px rgba(0,0,0,0.45),0 0 30px rgba(168,85,247,0.18),0 0 0 1px rgba(255,255,255,0.1)!important;filter:brightness(1.1) saturate(1.15)!important;}
.menu-card:active{transform:translateY(0) scale(0.94)!important;transition:transform 0.09s cubic-bezier(0.68,-0.55,0.27,1.55)!important;}
.menu-card .icon{font-size:2.5rem;margin-bottom:15px;display:block;transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);}
.menu-card:hover .icon{transform:scale(1.18) rotate(-5deg);}
.menu-card .icon.icon-img{width:58px;height:58px;object-fit:contain;}
.menu-card .label{font-size:1.1rem;font-weight:600;}

.menu-card.neon-focus{filter:brightness(1.25) saturate(1.15)!important;box-shadow:0 22px 50px rgba(0,0,0,0.45),0 0 35px rgba(99,102,241,0.55),0 0 60px rgba(168,85,247,0.35),inset 0 0 15px rgba(255,255,255,0.15)!important;transform:translateY(-8px) scale(1.03)!important;z-index:10;}

.card-purple{background:linear-gradient(135deg,#a855f7,#7e22ce)!important;}

.card-orange{background:linear-gradient(135deg,#f59e0b,#b45309)!important;}

.screen.active .grid-2>*:nth-child(1){animation-delay:0.04s;}

.screen.active .grid-2>*:nth-child(3){animation-delay:0.14s;}

/* ── Ripple ── */
.ripple-btn{position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;}

/* ── Light-theme contrast guard ─────────────────────────────
   Detects whether the currently active body background is a
   light color (any theme, present or future) and toggles
   body.theme-light so panels/text/back-btn switch to a closed,
   readable palette. getComputedStyle always normalizes colors
   to rgb()/rgba() — never hex — so we parse that, not hex.
   Fully-transparent stops (alpha 0, e.g. body's own unset
   background-color) are skipped so they don't drag the
   average down as if they were a real black stop.
   A MutationObserver on body's style attribute acts as the
   "signal": whenever ANYTHING changes the body background
   (theme picker, app boot, future code), every already-loaded
   module reacts instantly, with no fixed timing assumptions. */
function mcRelLuminanceRGB(r,g,b){
    const lin=c=>{c/=255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);};
    return 0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b);
}
function mcExtractRGB(str){
    const out=[];
    (str.match(/rgba?\([^)]+\)/g)||[]).forEach(m=>{
        const n=m.match(/[\d.]+/g).map(Number);
        if(n.length>=4 && n[3]===0) return;
        out.push([n[0],n[1],n[2]]);
    });
    (str.match(/#[0-9a-fA-F]{6}/g)||[]).forEach(h=>{
        out.push([parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);
    });
    return out;
}
function mcCheckThemeLightness(){
    const cs=getComputedStyle(document.body);
    const str=(cs.backgroundImage&&cs.backgroundImage!=='none'?cs.backgroundImage:'')+' '+cs.backgroundColor;
    const colors=mcExtractRGB(str);
    if(!colors.length){document.body.classList.remove('theme-light');return;}
    const avg=colors.reduce((s,[r,g,b])=>s+mcRelLuminanceRGB(r,g,b),0)/colors.length;
    document.body.classList.toggle('theme-light',avg>0.18);
}
mcCheckThemeLightness();
window.addEventListener('load',mcCheckThemeLightness);
setTimeout(mcCheckThemeLightness,300);
try{
    new MutationObserver(mcCheckThemeLightness)
        .observe(document.body,{attributes:true,attributeFilter:['style','class']});
}catch(e){}

/* ── T() translation helper ── */
function T(key) {
    var t = MultiCalc.data.translations[MultiCalc.state.currentLang] || MultiCalc.data.translations['en'];
    var v = t[key] !== undefined ? t[key] : (MultiCalc.data.translations['en'][key] !== undefined ? MultiCalc.data.translations['en'][key] : key);
    return v;
}

/* ── applyTranslations() ── */
function applyTranslations() {
    var t = MultiCalc.data.translations[MultiCalc.state.currentLang] || MultiCalc.data.translations['en'];
    var ms = document.getElementById('main-subtitle');
    if (ms) ms.innerText = t.mainSubtitle;
    var selectors = {
        '.t-m-calc':t.calc, '.t-m-sci':t.sci, '.t-m-units':t.units,
        '.t-m-phys':t.physics, '.t-m-curr':t.currency, '.t-m-equation':t.equation,
        '.t-m-date':t.dateCalc, '.t-m-percent':t.percentTools,
        '.t-m-bmi':t.bmiHealth, '.t-m-themes':t.themes, '.t-m-worldclock':t.worldClock
    };
    for (var sel in selectors) {
        var els = document.querySelectorAll(sel);
        els.forEach(function(el){ el.innerText = selectors[sel]; });
    }
    document.querySelectorAll('.t-back').forEach(function(el){ el.innerText = t.back; });
    document.querySelectorAll('.t-header-sub').forEach(function(el){ el.innerText = t.headerSub; });
    document.querySelectorAll('.t-history').forEach(function(el){ el.innerText = t.history; });
}

/* ── navTo() — screen navigation with animation ── */
function navTo(id, isBack) {
    isBack = isBack || false;
    var now = Date.now();
    if (now - MultiCalc.state.lastNavTime < 400) return;
    MultiCalc.state.lastNavTime = now;
    var prev = document.querySelector('.screen.active');
    var target = document.getElementById(id);
    if (!target || prev === target) return;

    document.querySelectorAll('.screen').forEach(function(scr){
        scr.classList.remove('active','active-back','exiting','exiting-back');
        if (scr !== target && scr !== prev) scr.style.display = 'none';
    });

    document.body.classList.add('is-animating');
    var safetyTimer = setTimeout(function(){
        document.body.classList.remove('is-animating');
    }, 600);

    if (prev) {
        prev.classList.add('exiting');
        if (isBack) prev.classList.add('exiting-back');
        setTimeout(function(){
            prev.style.display = 'none';
            prev.classList.remove('exiting','exiting-back');
            document.body.classList.remove('is-animating');
            clearTimeout(safetyTimer);
        }, 500);
    } else {
        document.body.classList.remove('is-animating');
        clearTimeout(safetyTimer);
    }

    target.style.display = 'block';
    target.offsetHeight; // force reflow
    target.classList.add(isBack ? 'active-back' : 'active');
    window.scrollTo({ top: 0, behavior: 'instant' });

    /* Start neon on menu screen */
    if (id === 'scr-menu') {
        setTimeout(initMainMenuNeonSequence, 400);
    }
}

/* ── setLang() ── */
function setLang(key) {
    MultiCalc.state.currentLang = key;
    applyTranslations();
    navTo('scr-menu');
    try { localStorage.setItem('multicalc_lang', key); } catch(e) {}
}

/* ── Build language cards ── */
function buildLangCards() {
    var list = document.getElementById('lang-list');
    if (!list) return;
    list.innerHTML = '';
    Object.keys(MultiCalc.data.langs).forEach(function(key) {
        var lang = MultiCalc.data.langs[key];
        var card = document.createElement('div');
        card.className = 'lang-card ripple-btn';
        card.innerHTML = '<span class="flag">' + lang.flag + '</span><div class="name">' + lang.name + '</div>';
        card.onclick = function(){ setLang(key); };
        list.appendChild(card);
    });
}

/* ── initMainMenuNeonSequence() ── */
function initMainMenuNeonSequence() {
    var grid = document.getElementById('main-menu-grid');
    if (!grid || grid.dataset.neonSequenceReady === '1') return;
    grid.dataset.neonSequenceReady = '1';
    var getCards = function(){ return Array.from(grid.querySelectorAll('.menu-card')); };
    var order = [], index = 0, timer = null;

    var shuffle = function(arr){
        var copy = arr.slice();
        for (var i = copy.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var tmp = copy[i]; copy[i] = copy[j]; copy[j] = tmp;
        }
        return copy;
    };

    var next = function(){
        var currentCards = getCards();
        if (!currentCards.length) return;
        currentCards.forEach(function(c){ c.classList.remove('neon-focus'); });
        if (!order.length || index >= order.length) { order = shuffle(currentCards); index = 0; }
        var card = order[index++];
        if (card && document.body.contains(card)) {
            card.classList.add('neon-focus');
            setTimeout(function(){ card.classList.remove('neon-focus'); }, 1120);
        }
        var delay = 2200 + Math.floor(Math.random() * 1500);
        timer = setTimeout(next, delay);
    };

    document.addEventListener('visibilitychange', function(){
        if (document.hidden) {
            if (timer) clearTimeout(timer); timer = null;
            getCards().forEach(function(c){ c.classList.remove('neon-focus'); });
        } else if (!timer) {
            timer = setTimeout(next, 500);
        }
    });

    timer = setTimeout(next, 900);
}

/* ── Ripple effect ── */
function addRipple(e) {
    var el = e.currentTarget;
    var rect = el.getBoundingClientRect();
    var size = Math.max(rect.width, rect.height) * 1.4;
    var x = (e.clientX || rect.left + rect.width/2) - rect.left - size/2;
    var y = (e.clientY || rect.top + rect.height/2) - rect.top - size/2;
    var ripple = document.createElement('span');
    ripple.className = 'ripple-circle';
    ripple.style.cssText = 'width:'+size+'px;height:'+size+'px;left:'+x+'px;top:'+y+'px;';
    el.appendChild(ripple);
    setTimeout(function(){ ripple.remove(); }, 600);
}

function initRipples() {
    document.querySelectorAll('.ripple-btn').forEach(function(el){
        el.removeEventListener('click', addRipple);
        el.addEventListener('click', addRipple, { passive: true });
    });
}

/* ── Boot ── */
document.addEventListener('DOMContentLoaded', function() {
    /* Restore saved language if any */
    try {
        var saved = localStorage.getItem('multicalc_lang');
        if (saved && MultiCalc.data.langs[saved]) {
            MultiCalc.state.currentLang = saved;
        }
    } catch(e) {}

    /* Build language selection cards */
    buildLangCards();

    /* Init ripple on all current .ripple-btn */
    initRipples();
});
</script>
