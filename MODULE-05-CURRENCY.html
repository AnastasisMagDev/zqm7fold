<script>
/* ── Light-theme contrast guard ─────────────────────────────
   Detects whether the currently active body background is a
   light color (any theme, present or future) and toggles
   body.theme-light so panels/text/back-btn switch to a closed,
   readable palette. getComputedStyle always normalizes colors
   to rgb()/rgba() — never hex — so we parse that, not hex.
   Fully-transparent stops (alpha 0, e.g. body's own unset
   background-color) are skipped so they don't drag the
   average down as if they were a real black stop.
   A MutationObserver on body's style attribute acts as the
   "signal": whenever ANYTHING changes the body background
   (theme picker, app boot, future code), every already-loaded
   module reacts instantly, with no fixed timing assumptions. */
function mcRelLuminanceRGB(r,g,b){
    const lin=c=>{c/=255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);};
    return 0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b);
}
function mcExtractRGB(str){
    const out=[];
    (str.match(/rgba?\([^)]+\)/g)||[]).forEach(m=>{
        const n=m.match(/[\d.]+/g).map(Number);
        if(n.length>=4 && n[3]===0) return;
        out.push([n[0],n[1],n[2]]);
    });
    (str.match(/#[0-9a-fA-F]{6}/g)||[]).forEach(h=>{
        out.push([parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);
    });
    return out;
}
function mcCheckThemeLightness(){
    const cs=getComputedStyle(document.body);
    const str=(cs.backgroundImage&&cs.backgroundImage!=='none'?cs.backgroundImage:'')+' '+cs.backgroundColor;
    const colors=mcExtractRGB(str);
    if(!colors.length){document.body.classList.remove('theme-light');return;}
    const avg=colors.reduce((s,[r,g,b])=>s+mcRelLuminanceRGB(r,g,b),0)/colors.length;
    document.body.classList.toggle('theme-light',avg>0.18);
}
mcCheckThemeLightness();
window.addEventListener('load',mcCheckThemeLightness);
setTimeout(mcCheckThemeLightness,300);
try{
    new MutationObserver(mcCheckThemeLightness)
        .observe(document.body,{attributes:true,attributeFilter:['style','class']});
}catch(e){}

/* ── CUR-4  Formatting helpers ── */
function fmtCurrencyAmount(amount, code) {
    var dp = MultiCalc.data.currencyDecimals;
    var decimals = dp.zero.has(code) ? 0 : dp.three.has(code) ? 3 : 2;
    return new Intl.NumberFormat('en-US', {minimumFractionDigits:decimals, maximumFractionDigits:decimals}).format(amount);
}
function fmtCurrencyRate(rate) {
    var abs = Math.abs(rate);
    var d = abs>=100000?0:abs>=10000?1:abs>=1000?2:abs>=100?3:abs>=10?4:abs>=1?5:abs>=0.1?6:7;
    return new Intl.NumberFormat('en-US', {minimumFractionDigits:d, maximumFractionDigits:d}).format(rate);
}

/* ── CUR-3  Live rates fetch ── */
var CURRENCY_API_URL = 'https://open.er-api.com/v6/latest/USD';
var CURRENCY_CACHE_TTL = 23*60*60*1000 + 56*60*1000;
async function fetchLiveRates() {
    if (MultiCalc.state.liveRates && MultiCalc.state.liveRatesFetchedAt &&
        (Date.now()-MultiCalc.state.liveRatesFetchedAt) < CURRENCY_CACHE_TTL) {
        return MultiCalc.state.liveRates;
    }
    try {
        var res = await Promise.race([
            fetch(CURRENCY_API_URL),
            new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),8000))
        ]);
        if (!res.ok) throw new Error('HTTP '+res.status);
        var data = await res.json();
        if (data?.result !== 'success' || !data.rates) throw new Error('Bad response');
        var rates = {};
        for (var k in data.rates) rates[k.toUpperCase()] = data.rates[k];
        MultiCalc.state.liveRates = rates;
        MultiCalc.state.liveRatesFetchedAt = Date.now();
        return rates;
    } catch(e) { return null; }
}

/* ── CUR-4  Conversion engine ── */
async function convertCurrency() {
    var amtRaw = document.getElementById('curr-amt').value.replace(',','.');
    var amt = parseFloat(amtRaw);
    var from = MultiCalc.state.currFrom || 'USD';
    var to   = MultiCalc.state.currTo   || 'EUR';
    var result = document.getElementById('result-curr');
    if (!result) return;
    if (!isFinite(amt) || amt <= 0) { result.innerText='Εισάγετε έγκυρο ποσό.'; result.classList.add('show'); return; }
    if (from === to) { result.innerHTML='<strong>'+fmtCurrencyAmount(amt,from)+' '+from+'</strong>'; result.classList.add('show'); return; }
    var liveRates = await fetchLiveRates();
    var rates = liveRates || MultiCalc.data.staticRates;
    var rFrom = rates[from] || MultiCalc.data.staticRates[from];
    var rTo   = rates[to]   || MultiCalc.data.staticRates[to];
    if (!rFrom || !rTo || rFrom===0) { result.innerText='Σφάλμα μετατροπής.'; return; }
    var crossRate   = rTo / rFrom;
    var converted   = amt * crossRate;
    var inverseRate = rFrom / rTo;
    var isLive = !!liveRates;
    result.innerHTML =
        '<strong>'+fmtCurrencyAmount(amt,from)+' '+from+' = '+fmtCurrencyAmount(converted,to)+' '+to+'</strong>'+
        '<div style="font-size:0.78rem;opacity:0.6;margin-top:8px;line-height:1.7;">'+
            '1&nbsp;'+from+'&nbsp;=&nbsp;'+fmtCurrencyRate(crossRate)+'&nbsp;'+to+
            '<span style="margin:0 8px;opacity:0.4;">|</span>'+
            '1&nbsp;'+to+'&nbsp;=&nbsp;'+fmtCurrencyRate(inverseRate)+'&nbsp;'+from+
            '<br><span style="font-size:0.72rem;">'+(isLive?'🟢 live':'⚪ offline (static rates)')+'</span>'+
        '</div>';
    result.classList.add('show');
}

/* ── CUR-5  UI functions ── */
function _updateCurrTrigger(side, code) {
    var flagEl = document.getElementById(side+'-flag');
    var codeEl = document.getElementById(side+'-code');
    var nameEl = document.getElementById(side+'-name');
    if (!flagEl||!codeEl||!nameEl) return;
    var curr = MultiCalc.data.allCurrencies.find(function(c){return c.code===code;});
    flagEl.innerText = MultiCalc.data.currencyFlags[code] || '🌍';
    codeEl.innerText = code;
    nameEl.innerText = curr ? (curr.el || curr.en) : code;
}

function swapCurrencies() {
    var tmp = MultiCalc.state.currFrom;
    MultiCalc.state.currFrom = MultiCalc.state.currTo;
    MultiCalc.state.currTo   = tmp;
    _updateCurrTrigger('from', MultiCalc.state.currFrom);
    _updateCurrTrigger('to',   MultiCalc.state.currTo);
    convertCurrency();
}

function openCurrPicker(side) {
    _currPickerSide = side || 'from';
    var overlay  = document.getElementById('curr-picker-overlay');
    var titleEl  = document.getElementById('curr-picker-title');
    var searchEl = document.getElementById('curr-picker-search');
    if (!overlay) return;
    titleEl.innerText = _currPickerSide==='from' ? 'Από — Επιλογή' : 'Προς — Επιλογή';
    if (searchEl) searchEl.value = '';
    var selected = _currPickerSide==='from' ? MultiCalc.state.currFrom : MultiCalc.state.currTo;
    _buildCurrPickerList(selected, '');
    overlay.style.display = ''; // MULTICALC-APP's loader force-sets this to
        // 'none' inline when injecting the overlay (so it can't flash open
        // before its CSS applies); nothing else ever clears it again, so
        // .open's opacity/pointer-events toggle alone can never make the
        // panel visible without this line.
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    setTimeout(function(){
        var sel = document.querySelector('#curr-picker-list .curr-picker-item.selected');
        if (sel) sel.scrollIntoView({block:'center',behavior:'smooth'});
    }, 280);
}

function closeCurrPicker() {
    var overlay = document.getElementById('curr-picker-overlay');
    if (!overlay) return;
    overlay.classList.remove('open');
    document.body.style.overflow = '';
}

function filterCurrPicker() {
    var q = (document.getElementById('curr-picker-search')?.value || '').trim();
    var selected = _currPickerSide==='from' ? MultiCalc.state.currFrom : MultiCalc.state.currTo;
    _buildCurrPickerList(selected, q);
}

function _buildCurrPickerList(selectedCode, query) {
    var list = document.getElementById('curr-picker-list');
    if (!list) return;
    var q = query.toLowerCase();
    var items = q
        ? MultiCalc.data.allCurrencies.filter(function(c){
            var name = c.el || c.en;
            return c.code.toLowerCase().includes(q) || name.toLowerCase().includes(q);
          })
        : MultiCalc.data.allCurrencies;
    if (!items.length) { list.innerHTML='<div class="curr-picker-empty">🔍 Δεν βρέθηκαν αποτελέσματα</div>'; return; }
    list.innerHTML = items.map(function(c){
        var name = c.el || c.en;
        var flag = MultiCalc.data.currencyFlags[c.code] || '🌍';
        var sel  = c.code === selectedCode;
        return '<div class="curr-picker-item'+(sel?' selected':'')+'" data-code="'+c.code+'" role="option" aria-selected="'+sel+'">'+
            '<span class="curr-picker-item-flag">'+flag+'</span>'+
            '<div class="curr-picker-item-info">'+
                '<div class="curr-picker-item-code">'+c.code+'</div>'+
                '<div class="curr-picker-item-name">'+name+'</div>'+
            '</div>'+
            '<span class="curr-picker-item-check">✓</span>'+
        '</div>';
    }).join('');
    list.onclick = function(e){
        var item = e.target.closest('.curr-picker-item');
        if (item?.dataset.code) selectCurrPickerItem(item.dataset.code);
    };
}

function selectCurrPickerItem(code) {
    if (!code) return;
    if (_currPickerSide==='from') MultiCalc.state.currFrom = code;
    else                          MultiCalc.state.currTo   = code;
    _updateCurrTrigger(_currPickerSide, code);
    closeCurrPicker();
    convertCurrency();
}

/* Keyboard: Escape closes picker */
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeCurrPicker(); });

/* Init */
_updateCurrTrigger('from', MultiCalc.state.currFrom);
_updateCurrTrigger('to',   MultiCalc.state.currTo);
fetchLiveRates();
</script>
</body>
</html>
